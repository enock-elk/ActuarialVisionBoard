<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enock's home for studies, rentals, tasks, and goals.">
    <meta name="theme-color" content="#0f172a">
    <title>Enock</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/assa-tracker-icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        try {
            if (localStorage.getItem('enock-theme') !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {}
    </script>
    <style>
        html.dark, html.dark body { background: #020617; color: #e2e8f0; }
        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCoP9KbK3fo6U5O0TV6CP8rAwfNjndlPUY",
            authDomain: "my-rent-data.firebaseapp.com",
            projectId: "my-rent-data",
            storageBucket: "my-rent-data.appspot.com",
            messagingSenderId: "841323250976",
            appId: "1:841323250976:web:7d9f828ed79ac528ddc345"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const COST_ELEC = 500;
        const COST_WIFI = 625;
        const COST_ADMIN = 1500;
        const DEFAULT_AREAS = ["Hatfield", "Muckleneuk", "Brooklyn", "Arcadia", "Sunnyside", "Menlo Park", "Queenswood", "Colbyn", "Hillcrest"];
        const PROPERTY_TYPES = ['Bachelor', '1 Bedroom', '2 Bedroom', 'Garden Cottage', 'House', 'Communal'];
        const TASK_AREAS = ['Study', 'Rent', 'Health', 'Life'];
        const HORIZONS = ['This month', 'This year', 'Longer'];

        const APPS = [
            { id: 'studies', title: 'Actuarial', detail: 'Syllabus, fees, and the study grind', href: './actuarial.html', tone: 'from-teal-500 to-indigo-600' },
            { id: 'gym', title: 'Gym hours', detail: 'HPC opening times', href: 'https://enock-elk.github.io/HPC-Gym-Hours/', tone: 'from-orange-500 to-rose-600' },
            { id: 'trains', title: 'Trains', detail: 'Metrorail schedule', href: 'https://enock-elk.github.io/metrorail-app/', tone: 'from-sky-500 to-blue-700' },
            { id: 'training', title: 'Training plan', detail: 'Work training calendar', href: 'https://enock-elk.github.io/December-Training/', tone: 'from-violet-500 to-fuchsia-700' }
        ];

        const normalizeUrl = (url) => {
            if (!url || typeof url !== 'string') return '';
            let clean = url.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '');
            if (clean.endsWith('/')) clean = clean.slice(0, -1);
            return clean;
        };

        const money = (n) => `R ${Number(n || 0).toLocaleString()}`;

        const explainError = (err) => {
            if (err && err.code === 'permission-denied') {
                return 'Firestore refused this read. The rentals rules need to allow the tasks and goals collections in the same project.';
            }
            return err ? err.message : 'Could not reach the database.';
        };

        function useLiveCollection(name) {
            const [rows, setRows] = useState([]);
            const [phase, setPhase] = useState('loading');
            const [error, setError] = useState('');
            useEffect(() => {
                const unsub = db.collection(name).onSnapshot((snap) => {
                    setRows(snap.docs.map((item) => ({ id: item.id, ...item.data() })));
                    setPhase('live');
                    setError('');
                }, (err) => {
                    setPhase('error');
                    setError(explainError(err));
                });
                return () => unsub();
            }, [name]);
            return { rows, phase, error };
        }

        function Shell() {
            const [section, setSection] = useState('home');
            const [dark, setDark] = useState(() => {
                try { return localStorage.getItem('enock-theme') !== 'light'; }
                catch (e) { return true; }
            });
            useEffect(() => {
                document.documentElement.classList.toggle('dark', dark);
                try { localStorage.setItem('enock-theme', dark ? 'dark' : 'light'); } catch (e) {}
            }, [dark]);

            const titles = { home: 'Home', rentals: 'Rentals', tasks: 'Tasks', goals: 'Goals' };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
                    <header className="sticky top-0 z-30 border-b border-slate-200/80 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
                        <div className="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
                            <div className="flex items-center gap-3">
                                {section !== 'home' && (
                                    <button onClick={() => setSection('home')} className="rounded-lg px-2 py-1 text-sm font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Home</button>
                                )}
                                <div>
                                    <p className="text-[11px] font-bold uppercase tracking-[0.18em] text-teal-600 dark:text-teal-400">Enock</p>
                                    <h1 className="text-lg font-bold leading-none">{titles[section]}</h1>
                                </div>
                            </div>
                            <button onClick={() => setDark(!dark)} className="rounded-full border border-slate-200 px-3 py-1 text-xs font-bold dark:border-slate-700">
                                {dark ? 'Light' : 'Dark'}
                            </button>
                        </div>
                    </header>
                    <main className="mx-auto max-w-6xl px-4 py-6 pb-16">
                        {section === 'home' && <Home onOpen={setSection} />}
                        {section === 'rentals' && <Rentals />}
                        {section === 'tasks' && <Tasks />}
                        {section === 'goals' && <Goals />}
                    </main>
                </div>
            );
        }

        function Home({ onOpen }) {
            const rentals = useLiveCollection('rentals');
            const tasks = useLiveCollection('tasks');
            const goals = useLiveCollection('goals');
            const openTasks = tasks.rows.filter((item) => !item.done).length;
            const openGoals = goals.rows.filter((item) => !item.done).length;

            return (
                <div className="space-y-8">
                    <section>
                        <h2 className="text-3xl font-bold tracking-tight">What needs you today</h2>
                        <p className="mt-2 max-w-2xl text-sm text-slate-500 dark:text-slate-400">
                            Rentals stay in the same Firestore project as the property app. Tasks and goals live beside them. The other tools open in their own apps.
                        </p>
                    </section>

                    <section className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                        <Door title="Rentals" detail="Pretoria places, effective rent, and move-in cost" stat={rentals.phase === 'live' ? `${rentals.rows.length} saved` : rentals.phase === 'error' ? 'Database blocked' : 'Connecting'} onClick={() => onOpen('rentals')} tone="bg-rose-600" />
                        <Door title="Tasks" detail="Short list across study, rent, health, and life" stat={tasks.phase === 'live' ? `${openTasks} open` : tasks.phase === 'error' ? 'Database blocked' : 'Connecting'} onClick={() => onOpen('tasks')} tone="bg-teal-600" />
                        <Door title="Goals" detail="The longer things you are moving toward" stat={goals.phase === 'live' ? `${openGoals} active` : goals.phase === 'error' ? 'Database blocked' : 'Connecting'} onClick={() => onOpen('goals')} tone="bg-amber-600" />
                    </section>

                    <section>
                        <h3 className="mb-3 text-xs font-bold uppercase tracking-wider text-slate-400">Open another app</h3>
                        <div className="grid gap-3 sm:grid-cols-2">
                            {APPS.map((app) => (
                                <a key={app.id} href={app.href} className="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
                                    <div className="flex items-center gap-3">
                                        <span className={`h-10 w-10 rounded-xl bg-gradient-to-br ${app.tone}`}></span>
                                        <span>
                                            <span className="block font-bold">{app.title}</span>
                                            <span className="block text-sm text-slate-500 dark:text-slate-400">{app.detail}</span>
                                        </span>
                                    </div>
                                    <span className="text-sm font-bold text-slate-400">Open</span>
                                </a>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        function Door({ title, detail, stat, onClick, tone }) {
            return (
                <button onClick={onClick} className="rounded-2xl border border-slate-200 bg-white p-5 text-left shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
                    <span className={`mb-4 inline-flex rounded-full px-2 py-1 text-[11px] font-bold uppercase tracking-wide text-white ${tone}`}>{stat}</span>
                    <span className="block text-xl font-bold">{title}</span>
                    <span className="mt-1 block text-sm text-slate-500 dark:text-slate-400">{detail}</span>
                </button>
            );
        }

        function Banner({ error }) {
            if (!error) return null;
            return <div className="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-200">{error}</div>;
        }

        function Rentals() {
            const { rows, phase, error } = useLiveCollection('rentals');
            const [editId, setEditId] = useState(null);
            const [filterArea, setFilterArea] = useState('all');
            const [filterType, setFilterType] = useState('all');
            const [sortOrder, setSortOrder] = useState('dateNew');
            const [customArea, setCustomArea] = useState(false);
            const [contact, setContact] = useState(null);
            const fileRef = useRef(null);
            const [form, setForm] = useState({
                link: '', area: 'Hatfield', type: 'Bachelor', rent: '', deposit: '',
                notes: '', contactNumber: '', elecIncluded: false, wifiIncluded: false, adminFee: false, closeToUp: false
            });

            const listings = rows.map((item) => ({
                ...item,
                effectiveRent: Number(item.rent) + (item.elecIncluded ? 0 : COST_ELEC) + (item.wifiIncluded ? 0 : COST_WIFI),
                moveInCost: Number(item.rent) + Number(item.deposit) + (item.adminFee ? COST_ADMIN : 0)
            }));

            const areas = useMemo(() => {
                const found = listings.map((item) => item.area).filter(Boolean);
                return Array.from(new Set([...DEFAULT_AREAS, ...found])).sort();
            }, [rows]);

            const duplicateForm = useMemo(() => {
                const clean = normalizeUrl(form.link);
                if (!clean) return false;
                return listings.some((item) => item.id !== editId && normalizeUrl(item.link) === clean);
            }, [form.link, rows, editId]);

            const duplicateIds = useMemo(() => {
                const groups = {};
                listings.forEach((item) => {
                    const clean = normalizeUrl(item.link);
                    if (!clean) return;
                    groups[clean] = groups[clean] || [];
                    groups[clean].push(item.id);
                });
                const ids = new Set();
                Object.values(groups).forEach((group) => { if (group.length > 1) group.forEach((id) => ids.add(id)); });
                return ids;
            }, [rows]);

            const visible = listings
                .filter((item) => filterArea === 'all' || item.area === filterArea)
                .filter((item) => filterType === 'all' || item.type === filterType)
                .sort((a, b) => {
                    if (sortOrder === 'priceAsc') return a.effectiveRent - b.effectiveRent;
                    if (sortOrder === 'priceDesc') return b.effectiveRent - a.effectiveRent;
                    if (sortOrder === 'moveInAsc') return a.moveInCost - b.moveInCost;
                    return new Date(b.addedAt || 0) - new Date(a.addedAt || 0);
                });

            const onChange = (event) => {
                const { id, value, type, checked } = event.target;
                setForm((prev) => {
                    const next = { ...prev, [id]: type === 'checkbox' ? checked : value };
                    if (id === 'rent' && (prev.deposit === '' || prev.deposit === prev.rent)) next.deposit = value;
                    return next;
                });
            };

            const reset = () => {
                setForm({
                    link: '', area: areas[0] || 'Hatfield', type: 'Bachelor', rent: '', deposit: '',
                    notes: '', contactNumber: '', elecIncluded: false, wifiIncluded: false, adminFee: false, closeToUp: false
                });
                setCustomArea(false);
                setEditId(null);
            };

            const save = async (event) => {
                event.preventDefault();
                if (duplicateForm) return;
                const payload = {
                    ...form,
                    link: form.link.trim(),
                    rent: Number(form.rent),
                    deposit: Number(form.deposit) || 0,
                    addedAt: editId ? (listings.find((item) => item.id === editId)?.addedAt || new Date().toISOString()) : new Date().toISOString()
                };
                delete payload.effectiveRent;
                delete payload.moveInCost;
                try {
                    if (editId) await db.collection('rentals').doc(editId).update(payload);
                    else await db.collection('rentals').add(payload);
                    reset();
                } catch (err) { alert(explainError(err)); }
            };

            const edit = (item) => {
                setEditId(item.id);
                setCustomArea(!areas.includes(item.area));
                setForm({
                    link: item.link || '', area: item.area || 'Hatfield', type: item.type || 'Bachelor',
                    rent: item.rent || '', deposit: item.deposit || '', notes: item.notes || '',
                    contactNumber: item.contactNumber || '',
                    elecIncluded: !!item.elecIncluded, wifiIncluded: !!item.wifiIncluded,
                    adminFee: !!item.adminFee, closeToUp: !!item.closeToUp
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const remove = async (id) => {
                if (!window.confirm('Delete this listing?')) return;
                try {
                    await db.collection('rentals').doc(id).delete();
                    if (editId === id) reset();
                } catch (err) { alert(explainError(err)); }
            };

            const exportJson = () => {
                const clean = listings.map(({ id, effectiveRent, moveInCost, ...item }) => item);
                const anchor = document.createElement('a');
                anchor.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(clean));
                anchor.download = 'rental_db_backup.json';
                anchor.click();
            };

            const importJson = async (event) => {
                const file = event.target.files && event.target.files[0];
                event.target.value = '';
                if (!file) return;
                const text = await file.text();
                try {
                    const uploaded = JSON.parse(text);
                    if (!Array.isArray(uploaded)) return alert('The file needs to be a list of listings.');
                    const existing = new Set(listings.map((item) => normalizeUrl(item.link)));
                    const fresh = uploaded.filter((item) => item.link && !existing.has(normalizeUrl(item.link)));
                    if (!fresh.length) return alert('Every listing in that file is already saved.');
                    if (!window.confirm(`Add ${fresh.length} new listings?`)) return;
                    const batch = db.batch();
                    fresh.slice(0, 400).forEach((item) => {
                        const { id, effectiveRent, moveInCost, ...data } = item;
                        batch.set(db.collection('rentals').doc(), { ...data, addedAt: data.addedAt || new Date().toISOString() });
                    });
                    await batch.commit();
                } catch (err) { alert(explainError(err)); }
            };

            const badge = (rent) => {
                if (rent <= 5290) return 'bg-emerald-100 text-emerald-800';
                if (rent <= 6200) return 'bg-amber-100 text-amber-800';
                return 'bg-rose-100 text-rose-800';
            };
            const badgeLabel = (rent) => rent <= 5290 ? 'Affordable' : rent <= 6200 ? 'Stretch' : 'Risk';

            return (
                <div className="grid gap-6 lg:grid-cols-12">
                    <div className="lg:col-span-4">
                        <form onSubmit={save} className="space-y-4 rounded-2xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900 lg:sticky lg:top-20">
                            <div className="flex items-center justify-between">
                                <h2 className="font-bold">{editId ? 'Edit listing' : 'Add listing'}</h2>
                                {editId && <button type="button" onClick={reset} className="text-xs font-bold text-rose-600">Cancel</button>}
                            </div>
                            <Field label="Listing URL"><input id="link" type="url" required value={form.link} onChange={onChange} className={inputClass(duplicateForm)} placeholder="Paste the advert link" /></Field>
                            {duplicateForm && <p className="text-xs font-bold text-rose-600">This link is already in the database.</p>}
                            <Field label="Area">
                                <div className="mb-1 text-right"><button type="button" onClick={() => setCustomArea(!customArea)} className="text-[11px] font-bold text-indigo-600">{customArea ? 'Choose from list' : 'New area'}</button></div>
                                {customArea
                                    ? <input id="area" value={form.area} onChange={onChange} className={inputClass()} />
                                    : <select id="area" value={form.area} onChange={onChange} className={inputClass()}>{areas.map((area) => <option key={area}>{area}</option>)}</select>}
                            </Field>
                            <Field label="Type">
                                <select id="type" value={form.type} onChange={onChange} className={inputClass()}>{PROPERTY_TYPES.map((type) => <option key={type}>{type}</option>)}</select>
                            </Field>
                            <div className="grid grid-cols-2 gap-3">
                                <Field label="Rent"><input id="rent" type="number" required value={form.rent} onChange={onChange} className={inputClass()} /></Field>
                                <Field label="Deposit"><input id="deposit" type="number" value={form.deposit} onChange={onChange} className={inputClass()} /></Field>
                            </div>
                            <Field label="Agent number"><input id="contactNumber" value={form.contactNumber} onChange={onChange} className={inputClass()} placeholder="082 000 0000" /></Field>
                            <Field label="Notes"><textarea id="notes" rows="2" value={form.notes} onChange={onChange} className={inputClass()} /></Field>
                            <Check id="elecIncluded" label="Electricity included" hint="Adds R500 when it is not" checked={form.elecIncluded} onChange={onChange} />
                            <Check id="wifiIncluded" label="WiFi included" hint="Adds R625 when it is not" checked={form.wifiIncluded} onChange={onChange} />
                            <Check id="adminFee" label="Admin fee" hint="Adds R1,500 to move-in" checked={form.adminFee} onChange={onChange} />
                            <Check id="closeToUp" label="Walking distance to UP" checked={form.closeToUp} onChange={onChange} />
                            <button disabled={duplicateForm} className="w-full rounded-xl bg-indigo-600 py-3 text-sm font-bold text-white disabled:bg-slate-400">{editId ? 'Update listing' : 'Save listing'}</button>
                        </form>
                    </div>
                    <div className="space-y-4 lg:col-span-8">
                        <Banner error={error} />
                        <div className="flex flex-wrap items-center gap-2">
                            <select value={filterArea} onChange={(e) => setFilterArea(e.target.value)} className={inputClass()}><option value="all">All areas</option>{areas.map((area) => <option key={area}>{area}</option>)}</select>
                            <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className={inputClass()}><option value="all">All types</option>{PROPERTY_TYPES.map((type) => <option key={type}>{type}</option>)}</select>
                            <select value={sortOrder} onChange={(e) => setSortOrder(e.target.value)} className={inputClass()}>
                                <option value="dateNew">Newest</option>
                                <option value="priceAsc">Monthly, low to high</option>
                                <option value="priceDesc">Monthly, high to low</option>
                                <option value="moveInAsc">Move-in, low to high</option>
                            </select>
                            <button onClick={exportJson} className="rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold dark:border-slate-700">Export</button>
                            <button onClick={() => fileRef.current.click()} className="rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold dark:border-slate-700">Import</button>
                            <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importJson} />
                            <span className="text-xs text-slate-400">{phase === 'loading' ? 'Connecting' : `${visible.length} shown`}</span>
                        </div>
                        {phase === 'loading' && <p className="text-sm text-slate-500">Opening the rental database…</p>}
                        {phase !== 'loading' && visible.length === 0 && <p className="rounded-2xl border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500 dark:border-slate-700">No listings in this view yet.</p>}
                        {visible.map((item) => (
                            <article key={item.id} className={`rounded-2xl border bg-white p-5 dark:bg-slate-900 ${duplicateIds.has(item.id) ? 'border-rose-300' : 'border-slate-200 dark:border-slate-800'}`}>
                                <div className="flex flex-wrap gap-2 text-[11px] font-bold uppercase">
                                    {duplicateIds.has(item.id) && <span className="rounded-full bg-rose-100 px-2 py-1 text-rose-700">Duplicate</span>}
                                    <span className={`rounded-full px-2 py-1 ${badge(item.effectiveRent)}`}>{badgeLabel(item.effectiveRent)}</span>
                                    <span className="rounded-full bg-slate-100 px-2 py-1 text-slate-600 dark:bg-slate-800 dark:text-slate-300">{item.area}</span>
                                    <span className="rounded-full bg-slate-100 px-2 py-1 text-slate-600 dark:bg-slate-800 dark:text-slate-300">{item.type}</span>
                                    {item.closeToUp && <span className="rounded-full bg-indigo-100 px-2 py-1 text-indigo-700">Near UP</span>}
                                </div>
                                <p className="mt-3 text-3xl font-bold">{money(item.effectiveRent)} <span className="text-xs font-medium text-slate-400">/ month effective</span></p>
                                <dl className="mt-3 grid max-w-md grid-cols-2 gap-1 text-xs text-slate-500">
                                    <dt>Base rent</dt><dd className="text-right font-bold text-slate-800 dark:text-slate-100">{money(item.rent)}</dd>
                                    <dt>Electricity</dt><dd className="text-right">{item.elecIncluded ? 'Included' : '+ R500'}</dd>
                                    <dt>WiFi</dt><dd className="text-right">{item.wifiIncluded ? 'Included' : '+ R625'}</dd>
                                </dl>
                                {item.notes && <p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-900 dark:bg-amber-950/40 dark:text-amber-100">{item.notes}</p>}
                                <div className="mt-4 flex flex-wrap items-center gap-2">
                                    <a href={item.link} target="_blank" rel="noreferrer" className="rounded-lg bg-slate-900 px-3 py-2 text-xs font-bold text-white dark:bg-slate-700">View listing</a>
                                    <button onClick={() => edit(item)} className="rounded-lg border border-orange-200 px-3 py-2 text-xs font-bold text-orange-700">Edit</button>
                                    {item.contactNumber && <button onClick={() => setContact(item)} className="rounded-lg border border-indigo-200 px-3 py-2 text-xs font-bold text-indigo-700">Contact</button>}
                                    <span className="ml-auto text-right text-xs text-slate-400">Move-in <strong className="block text-base text-slate-800 dark:text-white">{money(item.moveInCost)}</strong></span>
                                    <button onClick={() => remove(item.id)} className="text-xs font-bold text-slate-400 hover:text-rose-600">Delete</button>
                                </div>
                            </article>
                        ))}
                    </div>
                    {contact && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-4" onClick={() => setContact(null)}>
                            <div className="w-full max-w-sm rounded-2xl bg-white p-6 dark:bg-slate-900" onClick={(event) => event.stopPropagation()}>
                                <h3 className="text-lg font-bold">Contact</h3>
                                <p className="mt-1 text-sm text-slate-500">{contact.contactNumber}</p>
                                <div className="mt-4 grid grid-cols-2 gap-3">
                                    <a className="rounded-xl bg-emerald-600 py-3 text-center text-sm font-bold text-white" href={`tel:${contact.contactNumber}`}>Call</a>
                                    <a className="rounded-xl bg-teal-700 py-3 text-center text-sm font-bold text-white" target="_blank" rel="noreferrer" href={`https://wa.me/${String(contact.contactNumber).replace(/[^0-9]/g, '')}`}>WhatsApp</a>
                                </div>
                                <button onClick={() => setContact(null)} className="mt-4 w-full rounded-xl bg-slate-100 py-3 text-sm font-bold dark:bg-slate-800">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Tasks() {
            const { rows, phase, error } = useLiveCollection('tasks');
            const [title, setTitle] = useState('');
            const [area, setArea] = useState('Study');
            const open = rows.filter((item) => !item.done).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            const done = rows.filter((item) => item.done);

            const add = async (event) => {
                event.preventDefault();
                const text = title.trim();
                if (!text) return;
                try {
                    await db.collection('tasks').add({ title: text, area, done: false, createdAt: new Date().toISOString() });
                    setTitle('');
                } catch (err) { alert(explainError(err)); }
            };

            const toggle = async (item) => {
                try { await db.collection('tasks').doc(item.id).update({ done: !item.done }); }
                catch (err) { alert(explainError(err)); }
            };
            const remove = async (item) => {
                try { await db.collection('tasks').doc(item.id).delete(); }
                catch (err) { alert(explainError(err)); }
            };

            return (
                <div className="mx-auto max-w-2xl space-y-4">
                    <Banner error={error} />
                    <form onSubmit={add} className="flex flex-col gap-2 rounded-2xl border border-slate-200 bg-white p-4 sm:flex-row dark:border-slate-800 dark:bg-slate-900">
                        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Add a task" className={inputClass()} />
                        <select value={area} onChange={(e) => setArea(e.target.value)} className={inputClass()}>{TASK_AREAS.map((item) => <option key={item}>{item}</option>)}</select>
                        <button className="rounded-lg bg-teal-600 px-4 py-2 text-sm font-bold text-white">Add</button>
                    </form>
                    {phase === 'loading' && <p className="text-sm text-slate-500">Opening tasks…</p>}
                    <List items={open} empty="Nothing open." onToggle={toggle} onRemove={remove} />
                    {done.length > 0 && <div><h3 className="mb-2 text-xs font-bold uppercase text-slate-400">Done</h3><List items={done} onToggle={toggle} onRemove={remove} muted /></div>}
                </div>
            );
        }

        function Goals() {
            const { rows, phase, error } = useLiveCollection('goals');
            const [title, setTitle] = useState('');
            const [detail, setDetail] = useState('');
            const [horizon, setHorizon] = useState('This year');
            const active = rows.filter((item) => !item.done);
            const done = rows.filter((item) => item.done);

            const add = async (event) => {
                event.preventDefault();
                if (!title.trim()) return;
                try {
                    await db.collection('goals').add({ title: title.trim(), detail: detail.trim(), horizon, done: false, createdAt: new Date().toISOString() });
                    setTitle('');
                    setDetail('');
                } catch (err) { alert(explainError(err)); }
            };
            const toggle = async (item) => {
                try { await db.collection('goals').doc(item.id).update({ done: !item.done }); }
                catch (err) { alert(explainError(err)); }
            };
            const remove = async (item) => {
                try { await db.collection('goals').doc(item.id).delete(); }
                catch (err) { alert(explainError(err)); }
            };

            return (
                <div className="mx-auto max-w-2xl space-y-4">
                    <Banner error={error} />
                    <form onSubmit={add} className="space-y-2 rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
                        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Goal" className={inputClass()} />
                        <textarea value={detail} onChange={(e) => setDetail(e.target.value)} rows="2" placeholder="What done looks like" className={inputClass()} />
                        <div className="flex gap-2">
                            <select value={horizon} onChange={(e) => setHorizon(e.target.value)} className={inputClass()}>{HORIZONS.map((item) => <option key={item}>{item}</option>)}</select>
                            <button className="rounded-lg bg-amber-600 px-4 py-2 text-sm font-bold text-white">Save</button>
                        </div>
                    </form>
                    {phase === 'loading' && <p className="text-sm text-slate-500">Opening goals…</p>}
                    {active.length === 0 && phase === 'live' && <p className="text-sm text-slate-500">No active goals yet.</p>}
                    {active.map((item) => (
                        <article key={item.id} className="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
                            <div className="flex items-start justify-between gap-3">
                                <div>
                                    <p className="font-bold">{item.title}</p>
                                    {item.detail && <p className="mt-1 text-sm text-slate-500">{item.detail}</p>}
                                    <p className="mt-2 text-[11px] font-bold uppercase text-amber-700">{item.horizon}</p>
                                </div>
                                <div className="flex gap-2 text-xs font-bold">
                                    <button onClick={() => toggle(item)} className="text-teal-700">Done</button>
                                    <button onClick={() => remove(item)} className="text-slate-400">Delete</button>
                                </div>
                            </div>
                        </article>
                    ))}
                    {done.length > 0 && <h3 className="text-xs font-bold uppercase text-slate-400">Reached</h3>}
                    {done.map((item) => (
                        <article key={item.id} className="rounded-2xl border border-slate-200 p-4 opacity-70 dark:border-slate-800">
                            <div className="flex justify-between"><p className="font-bold line-through">{item.title}</p><button onClick={() => toggle(item)} className="text-xs font-bold">Reopen</button></div>
                        </article>
                    ))}
                </div>
            );
        }

        function List({ items, empty, onToggle, onRemove, muted }) {
            if (!items.length && empty) return <p className="text-sm text-slate-500">{empty}</p>;
            return (
                <ul className="space-y-2">
                    {items.map((item) => (
                        <li key={item.id} className={`flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-3 py-3 dark:border-slate-800 dark:bg-slate-900 ${muted ? 'opacity-60' : ''}`}>
                            <button onClick={() => onToggle(item)} aria-label={item.done ? 'Mark open' : 'Mark done'} className={`h-5 w-5 rounded border ${item.done ? 'bg-teal-600 border-teal-600' : 'border-slate-300'}`}></button>
                            <span className="flex-1">
                                <span className={`block text-sm font-medium ${item.done ? 'line-through' : ''}`}>{item.title}</span>
                                <span className="text-[11px] font-bold uppercase text-slate-400">{item.area}</span>
                            </span>
                            <button onClick={() => onRemove(item)} className="text-xs font-bold text-slate-400">Delete</button>
                        </li>
                    ))}
                </ul>
            );
        }

        function Field({ label, children }) {
            return <label className="block text-xs font-bold uppercase tracking-wide text-slate-400">{label}<span className="mt-1 block font-normal normal-case tracking-normal">{children}</span></label>;
        }
        function Check({ id, label, hint, checked, onChange }) {
            return (
                <label className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2 text-sm dark:bg-slate-800">
                    <span><span className="block font-medium">{label}</span>{hint && <span className="text-[11px] text-slate-400">{hint}</span>}</span>
                    <input id={id} type="checkbox" checked={checked} onChange={onChange} className="h-4 w-4" />
                </label>
            );
        }
        function inputClass(bad) {
            return `w-full rounded-lg border px-3 py-2 text-sm outline-none dark:bg-slate-800 ${bad ? 'border-rose-500' : 'border-slate-200 dark:border-slate-700'}`;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Shell />);
    </script>
</body>
</html>
